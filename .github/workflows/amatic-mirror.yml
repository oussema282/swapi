name: amatic-mirror
on:
  push:
    branches: [arena/01a0cba2-swapi]
    paths:
      - 'scripts/hunt/mirror.py'
      - 'scripts/hunt/mirror_run.sh'
      - '.github/workflows/amatic-mirror.yml'
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: mirror AM clients + gitlab probes + release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: bash scripts/hunt/mirror_run.sh
      - name: push mirror log
        if: always()
        run: |
          mkdir -p /tmp/logpush && cd /tmp/logpush && rm -rf .git
          git init -q -b mirror-log
          cp /tmp/hunt2/mirror.log . 2>/dev/null || echo "no mirror.log" > mirror.log
          cp /tmp/hunt2/mirror/_summary.txt . 2>/dev/null || true
          cp /tmp/hunt2/gl_*.txt . 2>/dev/null || true
          git config user.email "log@bot" && git config user.name "logbot"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git add -A
          git commit -qm "mirror log $(date -u +%FT%TZ)"
          git push -qf origin mirror-log
