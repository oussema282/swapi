name: pp-pack
on:
  push:
    branches: [arena/01a0cba2-swapi]
    paths:
      - 'scripts/hunt/pp_pack.sh'
      - 'scripts/hunt/pp_discover.py'
      - '.github/workflows/pp-pack.yml'
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: harvest non-AM clients (pragmatic-first) + mirror release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: bash scripts/hunt/pp_pack.sh
      - name: push log
        if: always()
        run: |
          mkdir -p /tmp/logpush && cd /tmp/logpush && rm -rf .git
          git init -q -b pp-pack-log
          cp /tmp/pp/pp.log . 2>/dev/null || echo "no log" > pp.log
          cp /tmp/pp/candidates.json . 2>/dev/null || true
          git config user.email "log@bot" && git config user.name "logbot"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git add -A
          git commit -qm "pp pack log $(date -u +%FT%TZ)"
          git push -qf origin pp-pack-log
