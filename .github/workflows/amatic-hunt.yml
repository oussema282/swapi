name: amatic-hunt
on:
  push:
    branches: [arena/01a0cba2-swapi]
    paths:
      - 'scripts/hunt/**'
      - '.github/workflows/amatic-hunt.yml'
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: deep probe
        run: bash scripts/hunt/probe.sh
      - name: push hunt log
        if: always()
        run: |
          mkdir -p /tmp/logpush && cd /tmp/logpush && rm -rf .git
          git init -q -b hunt-log
          cp /tmp/hunt/hunt.log . 2>/dev/null || echo "no hunt.log" > hunt.log
          cp /tmp/hunt/sample_*.html . 2>/dev/null || true
          git config user.email "log@bot" && git config user.name "logbot"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git add -A
          git commit -qm "hunt probe log $(date -u +%FT%TZ)"
          git push -qf origin hunt-log
